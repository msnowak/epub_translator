; Upload limits sized for the 100 MB EPUB uploads promised by MAX_UPLOAD_SIZE
; (see .env.example), with headroom above 100 MB for multipart overhead.
upload_max_filesize = 150M
post_max_size = 160M

; A 100 MB EPUB is a zip archive; unpacking it and building DOM trees per
; chapter can multiply that footprint well past the archive's own size.
memory_limit = 512M

; Sensible opcache defaults for a long-running FrankenPHP worker.
; validate_timestamps stays on (the default) because ./backend is bind-mounted
; into the container during local development - disabling it would require a
; container restart to pick up code changes. A production image can turn it
; off explicitly at deploy time.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
