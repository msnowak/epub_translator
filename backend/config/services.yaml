# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.storage_dir: '%env(APP_STORAGE_DIR)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    ollama.http_client:
        class: Symfony\Contracts\HttpClient\HttpClientInterface
        factory: ['App\Ollama\OllamaHttpClientFactory', 'create']
        arguments:
            $client: '@http_client'
            $baseUri: '%env(OLLAMA_BASE_URL)%'
            $apiKey: '%env(OLLAMA_API_KEY)%'
            $timeout: '%env(float:OLLAMA_TIMEOUT)%'

    App\Ollama\OllamaClient:
        arguments:
            $httpClient: '@ollama.http_client'

    App\Translation\TranslationEngineInterface: '@App\Ollama\OllamaClient'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@test:
    services:
        ollama.http_client:
            class: Symfony\Component\HttpClient\MockHttpClient
            public: true

        # Overrides the alias to OllamaClient, so no test can reach the network
        # by accident. Public, so a test can swap in its own scripted instance
        # the same way it swaps ollama.http_client.
        App\Translation\TranslationEngineInterface:
            class: App\Tests\Support\FakeTranslationEngine
            public: true

        # The first production consumer arrives with ParseEpubHandler; without this
        # the container would remove the service and the test container could not
        # reach it either. The entry stays: the writer test uses it directly.
        App\Epub\ProjectStructureWriter:
            autowire: true
            public: true

        # Konsument produkcyjny dochodzi razem z ProjectDownloadController
        # (Task 7); do tego czasu kontener usunalby usluge, a test nie mialby
        # jak po nia siegnac. Wpis znika w Tasku 7.
        App\Export\TranslatedEpubBuilder:
            autowire: true
            public: true
